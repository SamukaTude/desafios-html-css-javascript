<!DOCTYPE html>
<html>

<head>
    <title>Formatação de textos</title>
</head>

<body>
    <h1>Formatação de textos HTML</h1>

    <h2>Exemplos de formatação</h2>

    <p>
        <strong>Este texto e importante</strong>
    </p>

    <p>
        <em>Este texto está enfatizado</em>
    </p>

    <p>
        <mark>Este texto está destacado</mark>
    </p>

    <p>
        <small>Este texto está menor</small>
    </p>

    <p>
        <del>Este texto foi removido</del>
    </p>

    <p>
        <ins>Este texto foi inserido</ins>
    </p>

    <h2>Exemplos de fórmulas</h2>

    <p>
        Fórmula da água: H<sub>2</sub>0
    </p>

    <p>
        Fórmula do gás carbônico: CO<sub>2</sub>
    </p>

    <p>
        Dez ao quadrado: 10<sup>2</sup>
    </p>

</body>

</html>
