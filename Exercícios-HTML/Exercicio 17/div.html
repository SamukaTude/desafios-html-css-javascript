<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Organizando a Página com DIV</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- DIV 1 - Cabeçalho -->

    <div class="cabecalho">

        <h1>Meu Site</h1>

        <p>
            Bem-vindo ao meu site!
        </p>

    </div>


    <!-- DIV 2 - Menu -->

    <div class="menu">

        <h2>Menu</h2>

        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>

    </div>

    <!-- DIV 3 - Conteúdo -->

    <div class="conteudo">

        <h2>Conteúdo Principal</h2>

        <div class="area1">

            <h3>Área 1</h3>

            <p>
                Este é o primeiro conteúdo da página.
                Aqui posso apresentar informações sobre tecnologia.
            </p>

        </div>


        <div class="area2">

            <h3>Área 2</h3>

            <p>
                Este é o segundo conteúdo da página.
                Aqui posso apresentar informações sobre programação.
            </p>

        </div>

        <!-- DIV 4 - Rodapé -->

        <div class="rodape">

            <p>
                © 2026 - Meu Site
            </p>

        </div>

    </div>    

</body>

</html>
