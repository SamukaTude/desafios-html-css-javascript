<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Elementos Block e Inline</title>

    <style>

        /* Cor dos elementos Block */
        .block {
            background-color: lightblue;
            padding: 10px;
            margin-bottom: 10px;
        }


        /* Cor dos elementos Inline */
        .inline {
            background-color: lightgoldenrodyellow;
            padding: 5px;
        }

    </style>

</head>

<body>

    <h1>Elementos Block e Inline</h1>

    <h2 class="block">
        Elementos Block
    </h2>

    <!-- O elemento h2 é BLOCK -->

    <p class="block">
        Esse é um parágrafo e o elemento p é BLOCK.
    </p>

    <!-- O elemento p é BLOCK -->

    <div class="block">
        Este conteúdo está dentro de uma div.
        O elemento div é BLOCK.
    </div>

    <!-- O elemento div é BLOCK -->

    <h2 class="inline">
        Elemento Inline
    </h2>

    <p>

        Este é um texto com

        <!-- O elemento span é INLINE -->

        <span class="inline">
            span
        </span>

        e também temos

        <!-- O elemento strong é INLINE -->

        <strong class="inline">
            texto em negrito
        </strong>

        e um

        <!-- O elemento a é INLINE -->

        <a class="inline"
           href="https://www.google.com"
           target="_blank">

            link

        </a>.

    </p>

</body>

</html>
