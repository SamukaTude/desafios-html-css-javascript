<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Conteúdo Externo</title>

</head>

<body>

    <h1>Incorporando Conteúdo Externo</h1>

    <section>

        <h2>Mapa incorporado</h2>

        <p>
            Nesta seção estou utilizando um iframe para incorporar
            um conteúdo externo diretamente na página HTML.
        </p>

        <iframe
            src="https://www.google.com/maps?q=São%20Paulo&output=embed"
            width="600"
            height="450"
            title="Mapa de São Paulo">
        </iframe>

    </section>

</body>

</html>
