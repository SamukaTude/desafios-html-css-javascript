<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Trabalhando com atributos HTML</title>

</head>

<body>
    
    <h1>Atributos HTML</h1>

    <p>
        Esta página apresenta alguns atributos utilizados no HTML.
    </p>

    <!--src indica onde o arquivo está-->
    <!--alt fornece uma descrição da imagem-->
    <!--widhtn define a largura da imagem-->
    <!--height define a altura da imagem-->

    <img src="img/osasco.jpg"
         alt="imagem da cidade de Osasco"
         width="455"
         height="300">

    <h2>link</h2>
    
    <!--href indica o endereço para onde o link irá-->

    <a href="https://www.google.com">
        Acessar o Google
    </a>

    <h2>title</h2>

    <!--title fornece uma informação adicional ao passar o mouse-->

    <p title="Esta é uma informação adicional">
        Passe o mouse sobre este texto.
    </p>
    
</body>

</html>
